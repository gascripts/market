<script>

    theme: {
      extend: {
        fontFamily: { 
          sans: ['Prompt', 'sans-serif'],
          heading: ['Mitr', 'sans-serif']
        },
        colors: {
          bg: '#f8fafc', card: '#ffffff', ink: '#0f172a', muted: '#64748b', line: '#e2e8f0',
          brand: { DEFAULT: '#6366f1', d: '#4f46e5', l: '#e0e7ff', hover: '#818cf8' },
          accent: { DEFAULT: '#f97316', d: '#ea580c', hover: '#fb923c' },

</script>

    /* ═════════════════════════════════════════════════════════════
       RESPONSIVE · รองรับทุกขนาดจอ 320px → 4K
       ═════════════════════════════════════════════════════════════ */

    /* ── พื้นฐาน / ป้องกันล้นแนวนอน ── */
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-padding-top: 76px; }
    html:has(body.noscroll) { overflow: hidden; }
    body { overflow-x: clip; }
    body.noscroll { overscroll-behavior: none; }
    img, video, canvas { max-width: 100%; height: auto; }
    * { -webkit-tap-highlight-color: transparent; }
    :where(a, button, input, select, textarea, [tabindex]):focus-visible { outline: 2px solid rgba(99,102,241,.55); outline-offset: 2px; }
    .btn, .chip, .nav button, .tabbar button, .zoom button, .tabs button, .days label { touch-action: manipulation; }

    /* ── โครงหลัก ── */
    .wrap { padding: 1rem 0.75rem calc(1rem + env(safe-area-inset-bottom)); }
    .top .in { padding: 0.6rem 0.75rem; gap: 0.5rem; }
    .pad { padding: 1rem; }
    .card { border-radius: 20px; }
    .brand { font-size: clamp(15px, 4.6vw, 19px); gap: 0.5rem; }
    .brand span { max-width: 46vw; }
    .logo { width: 2.25rem; height: 2.25rem; border-radius: 0.8rem; }
    .logo svg { width: 20px; height: 20px; }
    .ubtn { gap: 0.45rem; padding-right: 0.75rem; }
    .ubtn.login { padding-left: 0.9rem; padding-right: 0.9rem; }

    /* ── เมนู: ต่ำกว่า 1024 ใช้แท็บล่าง, ตั้งแต่ 1024 ใช้เมนูบน ── */
    @media (max-width: 1023px) {
      .nav { display: none; }
      .tabbar { display: grid; }
      .ubtn { margin-left: auto; max-width: 44vw; }
      .wrap { padding-bottom: calc(104px + env(safe-area-inset-bottom)); }
    }
    @media (min-width: 1024px) {
      .tabbar { display: none; }

/* ═════════════ เรียก Apps Script ═════════════ */
function rpc(fn,...args){
  return new Promise((res,rej)=>{
    if(!(window.google&&google.script&&google.script.run))return rej(new Error('กรุณาเปิดผ่านลิงก์ Web App ที่ Deploy แล้ว'));
    google.script.run.withSuccessHandler(r=>{if(r&&r.ok===false)rej(new Error(r.error||'เกิดข้อผิดพลาด'));else res(r)})
      .withFailureHandler(e=>rej(new Error((e&&e.message)||String(e))))[fn](...args);
  });
}
let busyN=0;
const busy=on=>{busyN=Math.max(0,busyN+(on?1:-1));$('#busy').classList.toggle('on',busyN>0)};
async function call(fn,...args){
  busy(1);
  try{return await rpc(fn,...args)}
  catch(e){
    if(/เซสชันหมดอายุ/.test(e.message)&&S.user){S.user=null;setToken('');paint();toast('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่','err');openAuth('login')}
    else toast(e.message,'err');
    throw e;
  }finally{busy(0)}
}

    const covered=S.stalls.some(t=>t.zone!==k&&t.x<z.x+90&&t.x+t.w>z.x&&t.y<z.y&&t.y+t.h>z.y-22);

  S.stalls.forEach(s=>{
    const a=edit?null:S.avail[s.id],mine=!!(a&&a.mine);

    const lab=occ||(a&&a.shop?trunc(a.shop,Math.floor(s.w/7.5)):baht(s.price));

      +'<rect class="body" width="'+s.w+'" height="'+s.h+'" rx="10" fill="'+fillC+'" stroke="'+c.main+'" stroke-width="2.5"'+(mine?' stroke-dasharray="6 4"':'')+' filter="url(#sh)"/>'
      +'<rect width="'+s.w+'" height="14" rx="8" fill="'+(zp?zp.awn:'url(#aw-'+k+')')+'"/>'
      +'<text x="'+(s.w/2)+'" y="'+(s.h/2+8)+'" text-anchor="middle" class="sid" fill="'+inkC+'">'+esc(s.id)+'</text>'
      +'<text x="'+(s.w/2)+'" y="'+(s.h-10)+'" text-anchor="middle" class="sub" fill="'+inkC+'">'+esc(lab)+'</text>';

function pageMine(){
  if(!S.user)return loginPrompt('การจองของฉัน');
  const u=S.user;
  
  let listHtml = '';
  if(S.mine===null) listHtml='<div class="empty"><div class="spin mx-auto"></div></div>';
  else if(!S.mine.length) listHtml='<div class="card empty py-16 bg-slate-50 border-dashed"><div>'+ico('ticket',40)+'</div><b>ยังไม่มีรายการจอง</b><p class="mb-6 mt-1">เลือกล็อกที่ชอบแล้วจองได้เลย</p><button class="btn primary" data-act="go" data-p="book">ไปหน้าจองล็อก</button></div>';
  else {
    listHtml = '<div class="list">' + S.mine.map(b=>{
      const unpaid=b.status==='pending'&&b.payment!=='waiting';
      const statusColor = unpaid ? 'bg-status-pending' : (b.status==='confirmed' ? 'bg-status-free' : 'bg-slate-300');
      
      let warnHtml = '';
      if(unpaid&&b.expiresAt) warnHtml = '<div class="notice mb-3">'+ico('clock')+'<div>กรุณาชำระเงินภายใน <b>'+fdt(b.expiresAt)+'</b> ไม่เช่นนั้นล็อกจะถูกปล่อยให้ผู้อื่น</div></div>';
      else if (b.status==='rejected'&&b.adminNote) warnHtml = '<div class="notice err mb-3"><b>เหตุผล:</b> '+esc(b.adminNote)+'</div>';
      
      let acts = '';
      if(unpaid) acts += '<button class="btn primary sm" data-act="pay" data-id="'+esc(b.id)+'">'+ico('upload',16)+' ชำระเงิน / แนบสลิป</button>';
      if(b.status==='pending') acts += '<button class="btn sm bg-slate-100 border-none hover:bg-red-50 hover:text-red-600" data-act="cancelBk" data-id="'+esc(b.id)+'">ยกเลิกการจอง</button>';
      
      return '<div class="bk relative overflow-hidden"><div class="absolute top-0 left-0 w-1.5 h-full '+statusColor+'"></div><div class="bk-top"><div><div class="bk-stall">ล็อก '+esc(b.stallId)+'</div><div class="muted small">'+esc(b.id)+' · จองเมื่อ '+fdt(b.createdAt)+'</div></div>'+bkChip(b)+'</div>'+
        '<div class="bk-info"><div><span>ร้าน</span> <b>'+esc(b.shopName)+'</b></div><div><span>วันที่</span> <b>'+rangeLabel(b.from,b.to)+'</b> ('+b.days+' วัน)</div><div class="col-span-full"><span>สินค้า</span> '+esc(b.products)+'</div><div class="col-span-full mt-1 bg-white p-2 rounded-xl inline-block shadow-sm border border-line"><span>ยอดชำระ</span> <b class="text-[16px] text-brand">'+baht(b.price)+'</b></div></div>'+
        warnHtml + '<div class="bk-act">' + acts + '</div></div>';
    }).join('') + '</div>';
  }
  
  const shopNameHtml = u.shopName ? ' · ร้าน <b>'+esc(u.shopName)+'</b>' : '';
  
  return '<div class="sec-h mb-3"><h2 class="text-3xl">การจองของฉัน</h2></div>'+
  '<div class="card pad mb-6 bg-gradient-to-br from-white to-slate-50"><div class="flex justify-between items-center flex-wrap gap-4"><div class="row">'+avatar(u.name)+'<div><b class="text-[17px] font-heading">'+esc(u.name)+'</b><div class="muted small">@'+esc(u.username)+' · '+esc(u.phone)+shopNameHtml+'</div></div></div><div class="row"><button class="btn sm bg-white shadow-sm border-line hover:border-brand" data-act="profile">'+ico('edit',16)+' แก้ไขข้อมูล</button><button class="btn sm bg-white shadow-sm border-line hover:border-brand" data-act="chpw">เปลี่ยนรหัสผ่าน</button><button class="btn sm danger" data-act="logout">'+ico('out',16)+' ออกระบบ</button></div></div></div>'+listHtml;
}

const ADM_TABS=[['overview','ภาพรวม'],['bookings','การจอง'],['stalls','ล็อกและแผนผัง'],['users','สมาชิก'],['settings','ตั้งค่า']];

function pageAdmin(){
  if(!S.user||S.user.role!=='admin')return loginPrompt('สำหรับผู้ดูแลระบบ');
  
  let noticeHtml = '';
  if (S.user.weakPassword) {
    noticeHtml = '<div class="notice err mb-4">' + ico('shield') + '<div><b>ความปลอดภัย:</b> คุณยังใช้รหัสผ่านเริ่มต้น กรุณา <a href="#" data-act="chpw" class="underline font-bold">เปลี่ยนรหัสผ่านทันที</a></div></div>';
  }
  
  const tabsHtml = ADM_TABS.map(t=>'<button class="'+(S.admin.tab===t[0]?'on':'')+'" data-act="admTab" data-t="'+t[0]+'">'+t[1]+'</button>').join('');
  
  return noticeHtml +
  '<div class="sec-h mb-3"><h2 class="text-3xl">จัดการระบบ</h2></div>' +
  '<div class="tabs">' + tabsHtml + '</div>' +
  '<div id="admBody"><div class="empty"><div class="spin mx-auto"></div></div></div>';
}

async function loadAdmin(){
  const t=S.admin.tab;
  try{
    if(t==='overview'){const [d,b]=await Promise.all([call('api_adminDashboard',S.token),call('api_adminBookings',S.token)]);S.admin.dash=d;S.admin.bookings=b.bookings}
    else if(t==='bookings'){const b=await call('api_adminBookings',S.token);S.admin.bookings=b.bookings}
    else if(t==='stalls'){const r=await call('api_adminStalls',S.token);S.admin.stalls=r.stalls;S.dirty={};try{const b=await call('api_adminBookings',S.token);S.admin.bookings=b.bookings}catch(e){}}
    else if(t==='users'){const r=await call('api_adminUsers',S.token);S.admin.users=r.users}
    else if(t==='settings'){const r=await call('api_init',S.token);S.admin.meta=r.settingsMeta;S.settings=r.settings}
  }catch(e){return}
  if(S.page==='admin'&&S.admin.tab===t)renderAdmin();
}
function renderAdmin(){const b=$('#admBody');if(!b)return;const t=S.admin.tab;b.innerHTML=({overview:admOverview,bookings:admBookings,stalls:admStalls,users:admUsers,settings:admSettings}[t])()}

function admBk(b){
  let statusColor = 'bg-status-booked';
  if (b.status === 'pending') statusColor = 'bg-status-pending';
  else if (b.status === 'confirmed') statusColor = 'bg-status-free';
  else if (b.status === 'cancelled' || b.status === 'expired') statusColor = 'bg-slate-300';
  
  const phoneHtml = b.phone ? '· ' + esc(b.phone) : '';
  const noteHtml = b.note ? '<div class="col-span-full mt-1 text-amber-700 bg-amber-50 p-2 rounded-xl border border-amber-100"><span class="w-16">หมายเหตุ</span> ' + esc(b.note) + '</div>' : '';
  const adminNoteHtml = b.adminNote ? '<div class="col-span-full text-brand bg-brand-l p-2 rounded-xl mt-1"><span class="w-14">ผู้ดูแล</span> ' + esc(b.adminNote) + '</div>' : '';
  
  let acts = '';
  if (b.hasSlip) acts += '<button class="btn sm bg-indigo-50 text-indigo-700 hover:bg-indigo-100 border-none" data-act="slip" data-id="' + esc(b.id) + '">' + ico('eye',16) + ' ดูสลิป</button>';
  if (b.status==='pending'||b.status==='expired') acts += '<button class="btn ok sm" data-act="bkSet" data-do="confirm" data-id="' + esc(b.id) + '">' + ico('check',16) + ' ยืนยัน</button>';
  if (b.status==='pending') acts += '<button class="btn danger sm" data-act="bkSet" data-do="reject" data-id="' + esc(b.id) + '">ไม่ผ่าน</button>';
  if (b.status==='pending'||b.status==='confirmed') {
    acts += '<button class="btn sm bg-slate-100 border-none hover:bg-slate-200" data-act="bkSet" data-do="cancel" data-id="' + esc(b.id) + '">ยกเลิก</button>';
    acts += '<button class="btn sm bg-slate-100 border-none hover:bg-slate-200" data-act="moveStall" data-id="' + esc(b.id) + '">' + ico('map',16) + ' ย้ายล็อก</button>';
  }

  return '<div class="bk relative overflow-hidden"><div class="absolute top-0 left-0 w-1.5 h-full ' + statusColor + '"></div><div class="bk-top"><div><div class="bk-stall">ล็อก ' + esc(b.stallId) + ' <span class="text-muted font-normal text-base">· ' + esc(b.shopName) + '</span></div><div class="muted small">' + esc(b.id) + ' · ' + fdt(b.createdAt) + '</div></div>' + bkChip(b) + '</div>' +
  '<div class="bk-info bg-white border-none shadow-[inset_0_0_0_1px_#f1f5f9]"><div class="col-span-full mb-1"><span class="w-12">ผู้จอง</span> <b>' + esc(b.userName) + '</b> ' + phoneHtml + '</div><div><span class="w-12">วันที่</span> <b>' + rangeLabel(b.from,b.to) + '</b> (' + b.days + ' วัน)</div><div class="col-span-full"><span class="w-12">สินค้า</span> ' + esc(b.products) + '</div><div class="col-span-full mt-1 bg-slate-50 p-2 rounded-xl inline-block border border-slate-100"><span class="w-12">ยอด</span> <b class="text-[15.5px] text-brand">' + baht(b.price) + '</b></div>' + noteHtml + adminNoteHtml + '</div>' +
  '<div class="bk-act">' + acts + '</div></div>';
}

function admOverview(){
  const d=S.admin.dash,w=(S.admin.bookings||[]).filter(b=>b.status==='pending'&&b.payment==='waiting');
  const cards=[['รอตรวจสอบสลิป',d.waiting,'#f59e0b'],['รอชำระเงิน',d.unpaid,'#f97316'],['ยืนยันแล้ว',d.confirmed,'#10b981'],['รายได้ที่ยืนยัน',baht(d.revenue),'#6366f1'],['ล็อกทั้งหมด',d.stalls,'#64748b'],['สมาชิก',d.users,'#ec4899']];
  
  const bars=d.occupancy.map(o=>{
    const bp=o.total?o.booked/o.total*100:0,pp=o.total?o.pending/o.total*100:0;
    return '<div class="bar"><b>'+(o.booked+o.pending)+'/'+o.total+'</b><div class="col"><i style="height:'+bp+'%;background:#ef4444"></i><i style="height:'+pp+'%;background:#f59e0b"></i></div><small>'+fd(o.date,true).replace(/ \d{4}$/,'')+'</small></div>';
  }).join('');
  
  const cardsHtml = cards.map(c=>'<div class="stat !p-3 !rounded-[20px] relative"><div class="absolute left-0 top-0 bottom-0 w-[6px] rounded-r-full" style="background-color: '+c[2]+'"></div><div class="absolute -right-4 -bottom-4 w-16 h-16 rounded-full opacity-[0.08]" style="background-color: '+c[2]+'"></div><div class="n" style="font-size:'+(String(c[1]).length>6?22:28)+'px">'+c[1]+'</div><div class="l">'+c[0]+'</div></div>').join('');
  
  let occupancyHtml = '<div class="empty">ไม่มีข้อมูล</div>';
  if (d.occupancy.length) occupancyHtml = '<div class="bars">' + bars + '</div>';

  let waitingHtml = '<div class="card empty bg-emerald-50 border-dashed border-emerald-200"><div class="text-emerald-500">' + ico('check',40) + '</div><b class="text-emerald-700">ไม่มีรายการค้างตรวจสอบ</b>เยี่ยมมาก 🎉</div>';
  if (w.length) waitingHtml = '<div class="list">' + w.slice(0,6).map(admBk).join('') + '</div>';

  return '<div class="stats grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 mb-5">' + cardsHtml + '</div>' +
  '<section class="card pad mb-5"><div class="sec-h"><h3>การใช้งานล็อก ' + d.occupancy.length + ' วันเปิดตลาดถัดไป</h3><span class="muted small"><span class="chip s-booked font-semibold">ยืนยัน</span> <span class="chip s-pending font-semibold">รอตรวจสอบ</span></span></div>' + occupancyHtml + '</section>' +
  '<div class="sec-h"><h3>รอตรวจสอบสลิป <span class="bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full text-sm">' + w.length + '</span></h3></div>' + waitingHtml;
}

function admBookings(){
  const f=S.admin.f||'all',q=(S.admin.q||'').toLowerCase();
  const F=[['all','ทั้งหมด'],['waiting','รอตรวจสอบสลิป'],['unpaid','รอชำระ'],['confirmed','ยืนยันแล้ว'],['rejected','ไม่ผ่าน'],['cancelled','ยกเลิก'],['expired','หมดเวลา']];
  const match=b=>f==='all'||(f==='waiting'&&b.status==='pending'&&b.payment==='waiting')||(f==='unpaid'&&b.status==='pending'&&b.payment!=='waiting')||f===b.status;
  const list=(S.admin.bookings||[]).filter(match).filter(b=>!q||[b.id,b.stallId,b.shopName,b.userName,b.phone,b.products].join(' ').toLowerCase().includes(q));
  
  const tabsHtml = F.map(x=>'<button class="'+(f===x[0]?'on':'')+'" data-act="admF" data-f="'+x[0]+'">'+x[1]+'</button>').join('');
  
  let listHtml = '<div class="card empty border-dashed"><div>' + ico('inbox',32) + '</div><b>ไม่มีรายการ</b></div>';
  if (list.length) listHtml = '<div class="list">' + list.map(admBk).join('') + '</div>';

  return '<div class="row justify-between mb-4"><div class="field search flex-1 min-w-[240px]"><label class="hidden">ค้นหา</label>' + ico('search') + '<input id="admQ" placeholder="ค้นรหัสจอง, ล็อก, ชื่อร้าน, ชื่อผู้จอง, เบอร์โทร..." value="' + esc(S.admin.q||'') + '"></div><button class="btn primary shadow-md" data-act="walkin">' + ico('plus',16) + ' จองให้หน้าร้าน</button></div>' +
  '<div class="tabs">' + tabsHtml + '</div>' + listHtml;
}

function admStalls(){
  const st=S.admin.stalls||[];
  const save=Object.keys(S.dirty).length;
  let sHTML = '';
  if (save) sHTML = saveBarHTML(save);
  
  const rows = st.map(s=>'<tr><td><b class="text-base text-ink">'+esc(s.id)+'</b></td><td><span class="font-medium">'+esc(s.zone)+'</span> <span class="text-muted text-sm">· '+esc(s.zoneName)+'</span></td><td>'+esc(s.size)+'</td><td class="font-medium">'+baht(s.price)+'</td><td>'+(s.active?'<span class="chip s-ok">เปิดใช้งาน</span>':'<span class="chip s-mute">ปิดใช้งาน</span>')+'</td><td style="text-align:right"><button class="btn sm bg-slate-50 border-line hover:border-brand hover:text-brand" data-act="stallEdit" data-id="'+esc(s.id)+'">'+ico('edit',15)+' แก้ไข</button></td></tr>').join('');
  
  return '<div class="notice mb-4 bg-indigo-50 text-indigo-700 border-indigo-200 shadow-sm">'+ico('map')+'<div><b>โหมดแก้ไขแผนผัง:</b> ลากชิ้นงานเพื่อย้าย · แตะเพื่อแก้ไข/ลบ · ลากจุดมุมขวาล่างเพื่อย่อ-ขยาย · ชื่อบนล็อกคือผู้จองวันที่ <b id="admDateLbl">'+esc(fd(S.admDate||S.today,true))+'</b></div></div>'+
  '<div class="eltools" title="บันทึกอัตโนมัติไปยังเซิร์ฟเวอร์ · ใช้ สำรอง/นำเข้า เพื่อสำรองข้อมูล"><span class="muted small font-medium">เพิ่ม:</span>'+Object.keys(EL_TYPES).map(k=>'<button class="btn sm bg-white border-line hover:border-brand hover:text-brand" data-act="elAdd" data-t="'+k+'">'+ico(EL_TYPES[k].icon,16)+' '+EL_TYPES[k].name+'</button>').join('')+'<span class="sp"></span><label class="muted small ml-1">ผู้จองวันที่</label><input type="date" id="admDate" class="adm-date" value="'+esc(S.admDate||S.today)+'"><button class="btn sm bg-slate-100 border-none" data-act="elExport" title="สำรององค์ประกอบเป็น JSON">'+ico('copy',15)+' สำรอง</button><button class="btn sm bg-slate-100 border-none" data-act="elImport" title="นำเข้าองค์ประกอบจาก JSON">'+ico('upload',15)+' นำเข้า</button></div>'+
  '<section class="card pad mb-5"><div id="editMap">'+mapBox(true)+'</div><div id="saveBar">'+sHTML+'</div></section>'+
  '<div class="sec-h"><h3>รายการล็อกทั้งหมด <span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full text-sm">'+st.length+'</span></h3><button class="btn primary sm shadow-sm" data-act="stallEdit" data-id="">'+ico('plus',16)+' เพิ่มล็อกใหม่</button></div>'+
  '<section class="card overflow-hidden"><div class="overflow-x-auto"><table class="ptable min-w-[600px] bg-white"><thead><tr class="bg-slate-50"><th>รหัส</th><th>โซน</th><th>ขนาด</th><th>ค่าเช่า/วัน</th><th>สถานะ</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></section>';
}
const saveBarHTML=n=>'<div class="savebar"><span class="font-medium">✨ เปลี่ยนตำแหน่งแล้ว '+n+' ล็อก</span><span class="row"><button class="btn sm bg-white/10 border-none text-white hover:bg-white/20" data-act="posReset">ยกเลิก</button><button class="btn accent sm shadow-lg" data-act="posSave">บันทึกตำแหน่ง</button></span></div>';

function admUsers(){
  const u=S.admin.users||[];

function updateSum(){
  const f=$('form[data-form=book]');if(!f)return;

  if(!a||!b||b<a){$('#bkDays').textContent='ช่วงวันที่ไม่ถูกต้อง';$('#bkTotal').textContent='—';return}
  const n=diff(a,b)+1;$('#bkDays').textContent=n+' วัน × '+baht(s.price);$('#bkTotal').textContent=baht(n*s.price);
  const closed=[];for(let d=a;d<=b&&closed.length<40;d=addD(d,1))if(!isOpen(d))closed.push(d);

/* ═════════════ ชำระเงิน (PromptPay + สลิป) ═════════════ */
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?(((c<<1)^0x1021)&0xFFFF):((c<<1)&0xFFFF)}return c.toString(16).toUpperCase().padStart(4,'0')}
const tlv=(id,v)=>id+String(v.length).padStart(2,'0')+v;
function promptpay(target,amount){
  const t=String(target||'').replace(/\D/g,'');if(!t)return '';
  const acct=t.length>=15?tlv('03',t):t.length>=13?tlv('02',t):tlv('01','0066'+t.replace(/^0/,''));
  const p=tlv('00','01')+tlv('01','12')+tlv('29',tlv('00','A000000677010111')+acct)+tlv('53','764')+(amount?tlv('54',Number(amount).toFixed(2)):'')+tlv('58','TH')+'6304';
  return p+crc16(p);
}
function qrSVG(text){try{const q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:5,margin:2,scalable:true})}catch(e){return ''}}

  (qr?'<div class="qrbox"><span class="pp">PromptPay</span>'+qr+'<div class="text-[12px] text-slate-500 mt-2 bg-slate-100 px-3 py-1 rounded-full font-medium">สแกนด้วยแอปธนาคาร · '+esc(s.accountName)+'</div></div>':'')+

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='dFrom'){S.from=t.value||S.today;if(S.to<S.from)S.to=S.from;syncDates();reloadAvail()}
  else if(t.id==='dTo'){S.to=t.value&&t.value>=S.from?t.value:S.from;syncDates();reloadAvail()}
  else if(t.closest&&t.closest('form[data-form=book]')&&(t.name==='dateFrom'||t.name==='dateTo')){const f=t.form;if(f.dateTo.value<f.dateFrom.value)f.dateTo.value=f.dateFrom.value;updateSum()}

  else if(t.id==='slipFile'){
    const f=t.files&&t.files[0];if(!f)return;

  }
  else if (t.id === 'newStallSelect') {
    const form = t.closest('form');

    if (!opt.value) { $('#priceDiffAlert').innerHTML = ''; return; }

function readImage(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{const img=new Image();img.onload=()=>{const r=Math.min(1,1100/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.78))};img.onerror=()=>rej(new Error('ไฟล์นี้ไม่ใช่รูปภาพ'));img.src=fr.result};
    fr.onerror=()=>rej(new Error('อ่านไฟล์ไม่สำเร็จ'));fr.readAsDataURL(file);
  });
}

    if (!f.newStallId.value) return toast('กรุณาเลือกล็อกปลายทาง', 'err');
    if (!await confirmDlg('ยืนยันการย้ายล็อก? (ระบบจะอัปเดตราคาใหม่ให้โดยอัตโนมัติ)', 'ยืนยันการย้าย')) return;
    try {
      await call('api_adminMoveBooking', S.token, f.bId.value, f.newStallId.value);
      closeModal();
      toast('ย้ายล็อกสำเร็จ', 'ok');
      S.admin.dash = S.admin.bookings = null; 
      loadAdmin();
      reloadAvail();
    } catch(e) {}
  }
};
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const h=FORMS[f.dataset.form];if(h)h(f)});

/* ═════════════ ลากล็อกบนแผนผัง (โหมดแอดมิน) ═════════════ */
let drag=null, edrag=null, dragS=null;
const svgPt=(svg,e)=>{
  const p=svg.createSVGPoint();
  p.x=e.clientX; p.y=e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
};

document.addEventListener('pointerdown', e => {
  const shh = e.target.closest && e.target.closest('[data-stall-handle]');
  if (shh) {
    const sg = shh.closest('[data-edit-stall]');
    const sObj = sg && S.stalls.find(x => x.id === sg.dataset.editStall);
    if (sObj) {
      const spt = svgPt($('#mapSvg'), e);
      dragS = { s: sObj, g: sg, sx: e.clientX, sy: e.clientY, px: spt.x, py: spt.y, w0: sObj.w, h0: sObj.h, moved: false };
      try { $('#mapSvg').setPointerCapture(e.pointerId); } catch (x) {}
      sg.classList.add('dragging');
      e.preventDefault();
    }
    return;
  }
  const hnd = e.target.closest && e.target.closest('[data-el-handle]');
  if (hnd) {
    const hg = hnd.closest('[data-edit-el]');
    const hel = hg && elById(hg.dataset.editEl);
    if (hel) {
      const hp = svgPt($('#mapSvg'), e);
      try { $('#mapSvg').setPointerCapture(e.pointerId); } catch (x) {}
      const rr = -(Number(hel.rot || 0)) * Math.PI / 180;
      const ddx = hp.x - hel.x, ddy = hp.y - hel.y;
      edrag = { el: hel, g: hg, mode: 'resize', sx: e.clientX, sy: e.clientY, px: hp.x, py: hp.y, w0: hel.w, h0: hel.h,
        dx: (ddx * Math.cos(rr) - ddy * Math.sin(rr)) - hel.w, dy: (ddx * Math.sin(rr) + ddy * Math.cos(rr)) - hel.h, moved: false };
      hg.classList.add('dragging');
      e.preventDefault();
    }
    return;
  }
  const rH = e.target.closest && e.target.closest('[data-el-rot]');
  if (rH) {
    const rg = rH.closest('[data-edit-el]');
    const rel = rg && elById(rg.dataset.editEl);
    if (rel) {
      const rpt = svgPt($('#mapSvg'), e);
      edrag = { el: rel, g: rg, mode: 'rotate', sx: e.clientX, sy: e.clientY, rot0: Number(rel.rot || 0), a0: Math.atan2(rpt.y - rel.y, rpt.x - rel.x) * 180 / Math.PI, moved: false };
      try { $('#mapSvg').setPointerCapture(e.pointerId); } catch (x) {}
      rg.classList.add('dragging');
      e.preventDefault();
    }
    return;
  }
  const eg = e.target.closest && e.target.closest('[data-edit-el]');
  if (eg) {
    const el = elById(eg.dataset.editEl);
    if (el) {
      const pt = svgPt($('#mapSvg'), e);
      edrag = { el, g: eg, ox: pt.x - el.x, oy: pt.y - el.y, sx: e.clientX, sy: e.clientY, moved: false };
      eg.parentNode.appendChild(eg);
      eg.classList.add('dragging');
      try { eg.setPointerCapture(e.pointerId); } catch (x) {}
      e.preventDefault();
    }
    return;
  }
  const g = e.target.closest && e.target.closest('[data-edit-stall]');
  if (!g) return;
  const s = (S.admin.stalls || []).find(x => x.id === g.dataset.editStall);
  if (!s) return;
  
  const pt = svgPt($('#mapSvg'), e);
  drag = { g, s, ox: pt.x - s.x, oy: pt.y - s.y, sx: e.clientX, sy: e.clientY, moved: false };
  
  g.parentNode.appendChild(g); 
  g.classList.add('dragging');
  
  try { g.setPointerCapture(e.pointerId); } catch (x) {}
  e.preventDefault();
});

document.addEventListener('pointermove', e => {
  if (dragS) {
    if (!dragS.moved && Math.abs(e.clientX - dragS.sx) + Math.abs(e.clientY - dragS.sy) < 4) return;
    dragS.moved = true;
    const spt = svgPt($('#mapSvg'), e), st = dragS.s;
    st.w = Math.round(Math.max(30, Math.min(300, 1000 - st.x, dragS.w0 + (spt.x - dragS.px))) / 5) * 5;
    st.h = Math.round(Math.max(30, Math.min(300, 620 - st.y, dragS.h0 + (spt.y - dragS.py))) / 5) * 5;
    const gS = document.querySelector('[data-edit-stall="' + st.id + '"]');
    if (gS) {
      const rs = gS.querySelectorAll('rect'), tx = gS.querySelectorAll('text');
      if (rs[0]) { rs[0].setAttribute('width', st.w); rs[0].setAttribute('height', st.h); }
      if (rs[1]) { rs[1].setAttribute('width', st.w); }
      if (tx[0]) { tx[0].setAttribute('x', st.w / 2); tx[0].setAttribute('y', st.h / 2 + 8); }
      if (tx[1]) { tx[1].setAttribute('x', st.w / 2); tx[1].setAttribute('y', st.h - 10); }
      if (rs[2]) { rs[2].setAttribute('x', st.w - 10); rs[2].setAttribute('y', st.h - 10); }
    }
    return;
  }
  if (edrag) {
    if (!edrag.moved && Math.abs(e.clientX - edrag.sx) + Math.abs(e.clientY - edrag.sy) < 5) return;
    edrag.moved = true;
    const pt = svgPt($('#mapSvg'), e), el = edrag.el;
    if (edrag.mode === 'rotate') {
      const ang = Math.atan2(pt.y - el.y, pt.x - el.x) * 180 / Math.PI;
      let nr = Math.round((edrag.rot0 + ang - edrag.a0) / 5) * 5;
      nr = ((nr % 360) + 360) % 360;
      el.rot = nr;
      const gR = document.querySelector('[data-edit-el="' + el.id + '"]');
      if (gR) gR.outerHTML = elSVG(el, true);
      return;
    }
    if (edrag.mode === 'resize') {
      const rr2 = -(Number(el.rot || 0)) * Math.PI / 180;
      const ddx2 = pt.x - el.x, ddy2 = pt.y - el.y;
      const lx = ddx2 * Math.cos(rr2) - ddy2 * Math.sin(rr2);
      const ly = ddx2 * Math.sin(rr2) + ddy2 * Math.cos(rr2);
      el.w = Math.round(Math.max(24, Math.min(1000, lx - edrag.dx)) / 5) * 5;
      el.h = Math.round(Math.max(24, Math.min(620, ly - edrag.dy)) / 5) * 5;
      const hg2 = document.querySelector('[data-edit-el="' + el.id + '"]');
      if (hg2) hg2.outerHTML = elSVG(el, true);
      return;
    }
    el.x = Math.round(Math.max(0, Math.min(1000 - el.w, pt.x - edrag.ox)) / 5) * 5;
    el.y = Math.round(Math.max(0, Math.min(620 - el.h, pt.y - edrag.oy)) / 5) * 5;
    edrag.g.setAttribute('transform', elTf(el));
    return;
  }
  if (!drag) return;
  if (!drag.moved && Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) < 5) return;
  
  drag.moved = true;
  const pt = svgPt($('#mapSvg'), e), s = drag.s;
  
  s.x = Math.round(Math.max(0, Math.min(1000 - s.w, pt.x - drag.ox)) / 10) * 10;
  s.y = Math.round(Math.max(0, Math.min(620 - s.h, pt.y - drag.oy)) / 10) * 10;
  
  drag.g.setAttribute('transform', 'translate('+s.x+' '+s.y+')');
});

document.addEventListener('pointerup', () => {
  if (dragS) {
    const ds = dragS;
    dragS = null;
    const gS2 = document.querySelector('[data-edit-stall="' + ds.s.id + '"]');
    if (gS2) gS2.classList.remove('dragging');
    if (ds.moved) saveStallSize(ds.s);
    return;
  }
  if (edrag) {
    const ed = edrag;
    edrag = null;
    const curEl = document.querySelector('[data-edit-el="' + ed.el.id + '"]'); if (curEl) curEl.classList.remove('dragging');
    if (ed.moved) saveEls(); else elDialog(ed.el.id);
    return;
  }
  if (!drag) return;
  const d = drag;
  drag = null;
  
  d.g.classList.remove('dragging');
  
  if (d.moved) {
    S.dirty[d.s.id] = 1;
    const b = $('#saveBar');
    if (b) b.innerHTML = saveBarHTML(Object.keys(S.dirty).length);
  } else {
    A.stallEdit({ dataset: { id: d.s.id } });
  }
});

/* ═════════════ เริ่มระบบ ═════════════ */
async function boot(){
  try{
    const r=await rpc('api_init',S.token);
    S.settings=r.settings;S.stalls=r.stalls;S.avail=r.avail;S.today=r.today;S.from=S.to=r.defaultDate;S.user=r.user;
    if(Array.isArray(r.elements))S.el=r.elements;
    if(!r.user&&S.token)setToken('');
    if(r.settingsMeta)S.admin.meta=r.settingsMeta;
    paint();
  }catch(e){
    $('#view').innerHTML='<div class="boot"><div class="text-[54px] mb-2">😕</div><b class="text-xl text-ink">เปิดระบบไม่สำเร็จ</b><div class="notice err max-w-[420px] mx-auto text-left shadow-sm">'+esc(e.message)+'</div><button class="btn primary lg shadow-md mt-2" onclick="location.reload()">ลองใหม่</button></div>';
  }
}
boot();
</script>
